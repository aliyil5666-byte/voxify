<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voxify</title><link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#110d1c;--bg2:#190f2b;--bg3:#241a3b;--tx:#ece8f7;--mut:#9b91ba;--cy:#2cc4e8;--pu:#7b3ff0;--mg:#b4249f;--g:linear-gradient(135deg,var(--cy),var(--pu) 55%,var(--mg))}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.45 Sora,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--bg3)}
button:hover{filter:brightness(1.25)}button:focus-visible,input:focus-visible{outline:2px solid var(--cy)}
input{background:var(--bg);border:1px solid var(--bg3);border-radius:10px;padding:10px 12px;width:100%}
.pri{background:var(--g);font-weight:600}
.logo{background:#fff;border-radius:16px;padding:6px}
#login{height:100%;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center;padding:24px}
#login .logo{width:150px}#login p{color:var(--mut);max-width:34ch;margin:0}
#app{height:100%;display:grid;grid-template-columns:68px 250px 1fr}
#rail{background:#0b0813;padding:10px;display:flex;flex-direction:column;gap:10px;align-items:center;overflow:auto}
#rail button{width:48px;height:48px;padding:0;border-radius:24px;font-weight:700;display:grid;place-items:center;overflow:hidden}
#rail button.on{border-radius:14px;background:var(--g)}#rail .logo{padding:3px;border-radius:14px}#rail img{width:42px}
#side{background:var(--bg2);padding:14px;overflow:auto;display:flex;flex-direction:column;gap:6px}
#side h3{margin:4px 0 6px;font-size:15px}#side h4{margin:12px 0 2px;font-size:13px;color:var(--mut);font-weight:600;display:flex;justify-content:space-between;align-items:center}
#side h4 button{padding:2px 9px}
.row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;padding:8px}
.row.on{background:var(--bg3)}
.av{width:30px;height:30px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
#me{margin-top:auto;display:flex;align-items:center;gap:9px;padding-top:10px;border-top:1px solid var(--bg3)}
#me span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
.hd{padding:14px 18px;border-bottom:1px solid var(--bg3);display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
#msgs{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.m{display:flex;gap:11px}.m b{font-size:14px}.m small{color:var(--mut);margin-left:6px}.m p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
#sf{padding:12px 18px;display:flex;gap:8px}
.empty{margin:auto;text-align:center;color:var(--mut);display:grid;gap:12px;justify-items:center;padding:20px}.empty .logo{width:110px}
#cw{flex:1;display:flex;flex-direction:column;min-height:0}
.grid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:16px;align-content:center;overflow:auto}
.tile{position:relative;aspect-ratio:16/9;background:var(--bg2);border-radius:14px;overflow:hidden;display:grid;place-items:center}
.tile .av{width:64px;height:64px;font-size:26px}.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0}
.tile .nm{position:absolute;left:10px;bottom:8px;background:#000a;padding:2px 9px;border-radius:8px;font-size:13px}
.ctl{display:flex;gap:10px;justify-content:center;padding:14px;border-top:1px solid var(--bg3);flex-wrap:wrap}
.off{background:var(--mg)}
@media(max-width:760px){#app{grid-template-columns:56px 1fr}#side{display:none}#side.show{display:flex;position:fixed;inset:0 0 0 56px;z-index:5}#mt{display:inline-block!important}}
#mt{display:none}
.lgc{display:grid;gap:10px;width:min(340px,92vw);animation:rise .35s ease both}.lgc h3{margin:0}.lgc button{padding:12px 14px}
.lnk{background:none;color:var(--cy);padding:2px!important;font-size:13px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.simw{flex:1;min-height:0;position:relative}.simw canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hud{position:absolute;left:12px;top:12px;background:#0009;padding:6px 12px;border-radius:10px;font-size:13px;pointer-events:none}
.dot{width:10px;height:10px;border-radius:50%;background:#6b6580;margin-left:auto;flex:none}.dot.online{background:#3ddc84}.dot.idle{background:#ffb02e}.dot.busy{background:#ff5470}
.emo{display:flex;gap:2px;padding:0 18px;flex-wrap:wrap}.emo button{background:none;padding:2px 6px}
.del{background:none;color:var(--mut);padding:0 8px;margin-left:auto;opacity:.6}
.req{display:flex;gap:6px;align-items:center;margin:2px 0}.req span{flex:1;overflow:hidden;text-overflow:ellipsis}.req button{padding:6px 9px}
.code{font-weight:700;letter-spacing:.14em;text-align:center;border:1px dashed var(--pu)}
dialog{background:var(--bg2);color:var(--tx);border:1px solid var(--bg3);border-radius:16px;padding:22px;width:min(380px,92vw)}dialog::backdrop{background:#000b}
.pic{max-width:min(320px,100%);max-height:300px;border-radius:10px;margin-top:6px;display:block}
.fl{display:inline-block;margin-top:6px;background:var(--bg3);padding:6px 10px;border-radius:8px;color:var(--cy);text-decoration:none;word-break:break-all}
.hd{flex-wrap:wrap}.del+.del{margin-left:0}
.eb{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:96%}
.eb button{background:#000a;padding:6px 10px;font-size:13px}
.ftw{position:relative;flex:1;display:grid;place-items:center;align-content:center;gap:8px;padding:12px;min-height:0;overflow:auto}
#fc{width:100%;max-width:880px;height:auto;border-radius:14px;background:#0d2018}
.ct #rail,.ct #side{display:none}.ct #app{grid-template-columns:1fr}
.tile{cursor:pointer}.tile.big{grid-column:1/-1;aspect-ratio:auto;min-height:48vh}.grid.hb{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mi{position:absolute;right:10px;top:8px;background:#000a;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-style:normal;font-size:14px}
.mx{display:flex;justify-content:center;padding:6px 14px}.mx audio{width:min(440px,100%)}
.ctl select{background:var(--bg3);color:var(--tx);border:0;border-radius:10px;padding:9px}
.rb{margin:0 18px;padding:6px 10px;background:var(--bg3);border-radius:10px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.rq{border-left:3px solid var(--pu);padding:2px 8px;margin:3px 0;color:var(--mut);font-size:13px;cursor:pointer}
.seen{display:block;color:var(--cy);font-size:11px;margin-top:2px}
.acts{margin-left:auto;display:flex;opacity:.35}.m:hover .acts{opacity:1}.acts .del{margin-left:0}
.bd{background:var(--mg);border-radius:10px;padding:0 7px;font-size:12px;margin-left:auto}
#inc{position:fixed;right:16px;bottom:16px;z-index:20;background:var(--bg2);border:1px solid var(--pu);border-radius:14px;padding:14px;display:grid;gap:10px;box-shadow:0 8px 30px #000a}#inc div{display:flex;gap:8px}
.pic{cursor:zoom-in}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--mg);padding:10px 16px;border-radius:12px;z-index:30;animation:tin .3s}@keyframes tin{from{opacity:0}to{opacity:1}}
.joy{position:absolute;left:18px;bottom:64px;width:130px;height:130px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff40;touch-action:none;z-index:4}.joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:var(--g);opacity:.85;pointer-events:none}
.tb{position:absolute;right:18px;bottom:70px;display:flex;flex-direction:column;gap:12px;z-index:4}.tb button{width:72px;height:72px;border-radius:50%;font-size:15px;font-weight:700;background:#000a;border:2px solid #ffffff40;touch-action:none}
.dbg{position:absolute;left:10px;bottom:10px;font-size:11px;color:var(--mut);z-index:2;pointer-events:none}
.fxo{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}.fxo span{position:absolute;transform:translate(-50%,-50%);line-height:1;filter:drop-shadow(0 2px 4px #0008)}.tile .nm,.tile .mi{z-index:2}
.fxp{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:8px 14px;background:var(--bg2);border-top:1px solid var(--bg3)}.fxp label{display:grid;gap:2px;font-size:12px;color:var(--mut)}.fxp select{background:var(--bg3);color:var(--tx);border:0;border-radius:8px;padding:6px}
.g3{flex:1;position:relative;min-height:0;overflow:hidden;background:#0b0813}.g3 canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.hud3{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:min(780px,96%);pointer-events:none;z-index:2}
.bars{display:flex;align-items:center;gap:12px}.bar{flex:1;display:grid;gap:3px}.bar span{font-weight:700;font-size:14px;text-shadow:0 2px 6px #000}.bar.r{text-align:right}.bar b{font-size:12px;color:var(--mut)}
.tr{position:relative;height:20px;border-radius:12px;background:#0009;border:2px solid #fff3;overflow:hidden;transform:skewX(-12deg)}.bar.r .tr{transform:skewX(12deg)}
.tr i{position:absolute;inset:0 auto 0 0;width:100%;border-radius:10px}.bar.r .tr i{inset:0 0 0 auto}
.tr .fi{background:linear-gradient(90deg,#2cc4e8,#3ddc84);transition:width .15s}.bar.r .tr .fi{background:linear-gradient(270deg,#b4249f,#ff5470)}
.tr .fl{background:#ffd54a;transition:width .9s .4s}.tr.low .fi{background:linear-gradient(90deg,#ff5470,#ff9a3a);animation:pulse .5s infinite alternate}
.vs{font-weight:800;font-size:22px;background:var(--g);-webkit-background-clip:text;color:transparent}
.sb{display:flex;justify-content:center;align-items:center;gap:10px;font-weight:700;font-size:15px}.sb span{background:#000b;border-radius:10px;padding:2px 16px;font-size:28px}.sb b{padding:5px 12px;border-radius:10px}.sb b.a{background:#2cc4e8;color:#04202a}.sb b.b{background:#b4249f}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-weight:800;font-size:clamp(30px,7vw,84px);text-align:center;background:var(--g);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px #000a);animation:pop .55s cubic-bezier(.2,1.7,.4,1);z-index:3;pointer-events:none;white-space:nowrap}
.hint3{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#000a;padding:6px 14px;border-radius:10px;font-size:13px;z-index:2;pointer-events:none;text-align:center;width:max-content;max-width:94%}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.2);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes pulse{to{filter:brightness(1.5)}}
dialog form{display:grid;gap:10px}dialog label{display:grid;gap:4px;color:var(--mut);font-size:13px}
select{background:var(--bg);color:var(--tx);border:1px solid var(--bg3);border-radius:10px;padding:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<div id="login" hidden>
  <div class="logo"><img src="logo.png" alt="Voxify" width="150"></div>
  <p>Arkadaşlarınla yaz, konuş, görüntülü görüş.</p>
  <div id="lgm" class="lgc">
    <button class="pri" id="gbtn">Google ile giriş yap</button>
    <button id="lgReg">Kayıt Ol</button>
    <button id="lgIn">Giriş Yap</button>
  </div>
  <form id="regf" class="lgc" hidden>
    <h3>Kayıt Ol</h3>
    <input name="u" placeholder="Kullanıcı adı veya e-posta" autocomplete="username" required>
    <input name="p" type="password" placeholder="Parola (en az 6 karakter)" autocomplete="new-password" minlength="6" required>
    <input name="p2" type="password" placeholder="Parola tekrar" autocomplete="new-password" required>
    <button class="pri">Hesap oluştur</button><button type="button" data-lgback>Geri</button>
  </form>
  <form id="inf" class="lgc" hidden>
    <h3>Giriş Yap</h3>
    <input name="u" placeholder="Kullanıcı adı veya e-posta" autocomplete="username" required>
    <input name="p" type="password" placeholder="Parola" autocomplete="current-password" required>
    <button class="pri">Giriş yap</button><button type="button" class="lnk" data-lgreset>Parolamı unuttum</button><button type="button" data-lgback>Geri</button>
  </form>
  <p id="warn" style="color:#ff8fa3"></p>
</div>

<div id="app" hidden>
  <nav id="rail"></nav>
  <aside id="side"></aside>
  <main id="main"></main>
</div>

<dialog id="lb" style="width:min(720px,94vw)"><img style="max-width:100%;max-height:70vh;border-radius:10px" alt=""><div style="display:flex;gap:8px;margin-top:10px"><a class="fl" download="voxify-foto.jpg" href="#">⬇ Kaydet</a><button onclick="this.closest('dialog').close()">Kapat</button></div></dialog>
<div id="inc" hidden></div>
<dialog id="pd"><form id="pf"><h3 style="margin:0">Profilini düzenle</h3>
<label>Kullanıcı adı<input name="nm" maxlength="24" required></label>
<label>Biyografi<input name="bio" maxlength="190" placeholder="Kendinden kısaca bahset"></label>
<label>Durum<select name="status"><option value="online">Çevrimiçi</option><option value="idle">Boşta</option><option value="busy">Rahatsız etmeyin</option><option value="offline">Görünmez</option></select></label>
<label>Profil fotoğrafı<input type="file" name="photo" accept="image/*"></label>
<button class="pri">Kaydet</button><button type="button" onclick="this.closest('dialog').close()">Kapat</button></form></dialog>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// 1) Firebase konsolundan aldığın ayarları buraya yapıştır (README.md'ye bak)
const firebaseConfig={apiKey:"BURAYA",authDomain:"BURAYA",projectId:"BURAYA",appId:"BURAYA"};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
if(firebaseConfig.apiKey==='BURAYA'){$('#login').hidden=false;$('#warn').textContent='Önce index.html içindeki firebaseConfig alanını doldur.';document.querySelectorAll('#lgm button').forEach(b=>b.disabled=true)}
else{
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp;
let me,view={type:'home'},unsubs=[],call=null,S={servers:[],friends:[],ch:[]};
const pair=(a,b)=>[a,b].sort().join('_');
const QP=new URLSearchParams(location.search),CALLTAB=QP.has('room');if(CALLTAB)document.body.classList.add('ct');
const av=u=>`<span class="av">${u.photo?`<img src="${esc(u.photo)}" alt="" referrerpolicy="no-referrer">`:esc((u.name||'?')[0].toUpperCase())}</span>`;

$('#gbtn').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>$('#warn').textContent='Giriş yapılamadı: '+e.message);

/* ---------- Kayıt Ol / Giriş Yap (kullanıcı adı veya e-posta + parola) ---------- */
const showLg=id=>{['lgm','regf','inf'].forEach(x=>$('#'+x).hidden=x!==id);$('#warn').textContent=''};
$('#lgReg').onclick=()=>showLg('regf');$('#lgIn').onclick=()=>showLg('inf');
document.querySelectorAll('[data-lgback]').forEach(b=>b.onclick=()=>showLg('lgm'));
const lgMail=u=>{u=u.trim().toLowerCase();return u.includes('@')?u:u+'@users.voxify.app'};
const lgOk=u=>u.includes('@')||/^[a-zA-Z0-9_.-]{3,20}$/.test(u);
const lgErr=e=>({'auth/email-already-in-use':'Bu kullanıcı adı ya da e-posta zaten kayıtlı.','auth/invalid-credential':'Kullanıcı adı veya parola hatalı.','auth/wrong-password':'Kullanıcı adı veya parola hatalı.','auth/user-not-found':'Kullanıcı adı veya parola hatalı.','auth/weak-password':'Parola en az 6 karakter olmalı.','auth/invalid-email':'Geçersiz e-posta adresi.','auth/operation-not-allowed':'Firebase\'de "E-posta/Şifre" girişi kapalı. Authentication → Sign-in method bölümünden aç.','auth/too-many-requests':'Çok fazla deneme yapıldı, biraz bekle.','auth/network-request-failed':'İnternet bağlantısı yok.'}[e.code]||e.message);
$('#regf').onsubmit=async e=>{e.preventDefault();const f=e.target,u=f.u.value.trim();
  if(!lgOk(u))return $('#warn').textContent='Kullanıcı adı 3-20 karakter olmalı (harf, rakam, _ . -) ya da geçerli bir e-posta gir.';
  if(f.p.value!==f.p2.value)return $('#warn').textContent='Parolalar aynı değil.';
  try{await auth.createUserWithEmailAndPassword(lgMail(u),f.p.value)}catch(x){$('#warn').textContent=lgErr(x)}};
$('#inf').onsubmit=async e=>{e.preventDefault();const f=e.target;
  try{await auth.signInWithEmailAndPassword(lgMail(f.u.value),f.p.value)}catch(x){$('#warn').textContent=lgErr(x)}};
document.querySelector('[data-lgreset]').onclick=async()=>{const u=$('#inf').u.value.trim();
  if(!u.includes('@'))return $('#warn').textContent='Parola sıfırlama sadece e-postayla kayıt olan hesaplarda çalışır. E-posta adresini yaz.';
  try{await auth.sendPasswordResetEmail(u.toLowerCase());$('#warn').style.color='var(--cy)';$('#warn').textContent='Sıfırlama bağlantısı e-postana gönderildi.'}catch(x){$('#warn').textContent=lgErr(x)}};
auth.onAuthStateChanged(async u=>{
  if(!u){$('#login').hidden=false;$('#app').hidden=true;showLg('lgm');return}
  const ref=db.collection('users').doc(u.uid),sn=await ref.get();let fu;
  me=sn.exists?sn.data():{uid:u.uid,name:u.displayName||u.email.split('@')[0],photo:u.photoURL||'',bio:'',status:'online'};
  const need=!me.code;if(need)me.code=Math.random().toString(36).slice(2,10).toUpperCase();
  if(!sn.exists||need)await ref.set(me,{merge:true});
  $('#login').hidden=true;$('#app').hidden=false;
  db.collection('servers').where('members','array-contains',me.uid).onSnapshot(s=>{S.servers=s.docs.map(d=>({id:d.id,...d.data()}));renderRail();if(view.sid)loadMem();startWatch()});
  db.collection('users').doc(me.uid).collection('friends').onSnapshot(s=>{
    const ids=s.docs.map(d=>d.id).slice(0,30);fu&&fu();
    if(!ids.length){S.friends=[];if(!view.sid)renderSide();return}
    fu=db.collection('users').where('uid','in',ids).onSnapshot(q=>{S.friends=q.docs.map(d=>d.data());if(!view.sid)renderSide();startWatch()});
  });
  db.collection('requests').where('to','==',me.uid).onSnapshot(q=>{S.reqs=q.docs.map(d=>({id:d.id,...d.data()}));if(!view.sid)renderSide()});
  db.collection('users').doc(me.uid).collection('blocks').onSnapshot(q=>{S.blocks=q.docs.map(d=>d.data());renderSide();if(view.type==='text'||view.type==='dm')renderMain()});
  if(!CALLTAB){
    document.addEventListener('click',()=>{window.Notification&&Notification.permission==='default'&&Notification.requestPermission()},{once:true});
    db.collection('rings').doc(me.uid).onSnapshot(d=>{const r=d.data(),el=$('#inc');
      if(!r||Date.now()-r.ts>45000){stopRing();el.hidden=true;return}
      S.ring=r;el.hidden=false;el.innerHTML=`<b>📞 ${esc(r.name)} seni arıyor</b><div><button class="pri" data-ra>Kabul et</button><button class="off" data-rd>Reddet</button></div>`;
      startRing();clearTimeout(S.rt);S.rt=setTimeout(()=>{stopRing();el.hidden=true},45000);
      if(window.Notification&&Notification.permission==='granted'){const n=new Notification('Gelen arama',{body:r.name+' seni arıyor',icon:'logo.png',requireInteraction:true});n.onclick=()=>{window.focus();n.close()}}
    },()=>{});
  }
  if(CALLTAB){go({type:'voice',room:QP.get('room'),name:QP.get('name')||'Görüşme',sid:QP.get('sid')||undefined,peer:QP.get('peer')||undefined});joinCall(QP.get('room'))}
  else go({type:'home'});
});

function go(v){
  if(call&&!(['voice','foot','box','foot3'].includes(v.type)&&v.room===call.room))leaveCall();
  unsubs.forEach(f=>f());unsubs=[];
  if(v.sid!==view.sid){S.ch=[];S.mem=[]}
  view=v;
  if(v.sid)unsubs.push(db.collection('servers').doc(v.sid).collection('channels').onSnapshot(s=>{S.ch=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));renderSide()}));
  if(S.un){delete S.un[v.type==='dm'?'d'+v.peer:'c'+v.cid];bump()}
  renderRail();renderSide();renderMain();$('#side').classList.remove('show');if(v.sid)loadMem();
}

function renderRail(){

async function addServer(){
  const n=prompt('Yeni sunucu adı yaz.\nDavet koduyla katılmak için kodu # ile başlat (örn. #AB12CD).');
  if(!n)return;
  if(n[0]==='#'){
    const q=await db.collection('servers').where('code','==',n.slice(1).trim().toUpperCase()).limit(1).get();
    if(q.empty)return alert('Bu kodla sunucu bulunamadı.');
    await q.docs[0].ref.update({members:firebase.firestore.FieldValue.arrayUnion(me.uid)});
    return go({type:'server',sid:q.docs[0].id});
  }
  const ref=await db.collection('servers').add({name:n.trim().slice(0,30),owner:me.uid,members:[me.uid],code:Math.random().toString(36).slice(2,8).toUpperCase()});
  await ref.collection('channels').add({name:'genel',type:'text'});

  go({type:'server',sid:ref.id});
}

const readData=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};i.src=URL.createObjectURL(f)});

async function joinCall(room,dataOnly){

  await mine.set({name:me.name,sid,ts:Date.now()});

  if(stream)tile(me.uid,stream,true,me.name);
  /* Kimin kimi arayacağı belli: iki kişiden uid'i BÜYÜK olan teklif (offer) gönderir, diğeri yanıtlar. Böylece çakışma olmaz. */
  C.subs.push(base.collection('p').onSnapshot(s=>s.docChanges().forEach(c=>{
    const id=c.doc.id;if(id===me.uid||call!==C)return;
    if(c.type==='removed'){drop(id);return}
    const d=c.doc.data();if(!d)return;
    const pc=C.pcs[id];if(pc&&pc.rsid===d.sid)return;
    if(pc)drop(id);
    (C.names=C.names||{})[id]=d.name;
    if(me.uid>id)peer(id,true,d.name,d.sid)
  })));
  C.subs.push(base.collection('sig').where('to','==',me.uid).onSnapshot(s=>{
    const L=s.docChanges().filter(c=>c.type==='added').map(c=>{const m=c.doc.data();c.doc.ref.delete();return m}).sort((x,y)=>(x.ts||0)-(y.ts||0));

      if(d.mic!==undefined||d.flt!==undefined||d.fxo){if(d.mic!==undefined)setMute(id,d.mic);if(d.flt!==undefined)setFlt(id,d.flt);if(d.fxo)setFxo(id,d.fxo);return}
      if(!d.bye&&!call.sim&&!call.simOff&&call.stream&&$('#cw')){call.sim=startSim();renderCall()}
      call.sim&&call.sim.msg(id,d)};
    ch.onopen=()=>{pc.dc=ch;hello(ch)};
    if(ch.readyState==='open'){pc.dc=ch;hello(ch)}else pc.dc=pc.dc||ch};
  if(init){wire(pc.createDataChannel('sim'));offer(id)}else pc.ondatachannel=e=>wire(e.channel);
  return pc;
}
async function offer(id){
  const pc=call&&call.pcs[id];if(!pc)return;
  if(pc.signalingState!=='stable'){setTimeout(()=>offer(id),400);return}
  try{const o=await pc.createOffer();await pc.setLocalDescription(o);if(call&&call.pcs[id]===pc&&pc.localDescription)sig(id,'offer',pc.localDescription.toJSON(),pc.n)}catch(e){console.warn('offer',e)}
}
async function onSig(m){
  const C=call;if(!C)return;let pc=C.pcs[m.from];const d=JSON.parse(m.data),key=m.from+'|'+m.n;
  const flush=q=>{(q.q||[]).forEach(x=>q.addIceCandidate(x).catch(()=>{}));q.q=[]};
  try{
    if(m.kind==='ice'){
      if(!pc||pc.n!==m.n){(C.pend[key]=C.pend[key]||[]).push(d);return}
      pc.remoteDescription?pc.addIceCandidate(d).catch(()=>{}):(pc.q=pc.q||[]).push(d);return}
    if(m.kind==='offer'){
      if(pc&&pc.n!==m.n){drop(m.from);pc=null}
      pc=pc||peer(m.from,false,m.name,m.sid,m.n);
      pc.q=(pc.q||[]).concat(C.pend[key]||[]);delete C.pend[key];
      await pc.setRemoteDescription(d);flush(pc);
      const a=await pc.createAnswer();await pc.setLocalDescription(a);sig(m.from,'answer',pc.localDescription.toJSON(),pc.n);return}
    if(m.kind==='answer'&&pc&&pc.n===m.n){await pc.setRemoteDescription(d);flush(pc)}
  }catch(e){console.warn('sinyal',m.kind,e)}
}
function drop(id){if(!call)return;call.sim?.rm(id);call.foot?.gone();call.pcs[id]?.close();delete call.pcs[id];call.grid.querySelector('[data-id="'+id+'"]')?.remove()}

function toggleMic(b){const t=call.stream.getAudioTracks()[0];t.enabled=!t.enabled;call.muted=!t.enabled;b.textContent=t.enabled?'Mikrofonu kapat':'Mikrofonu aç';b.classList.toggle('off',call.muted);setMute(me.uid,call.muted);bc({mic:call.muted?1:0})}
async function toggleVideo(kind){
  if(call.vt){delT(call.vt);call.vt=null;call.vk=null;if(call.sat){delT(call.sat);call.sat=null}}
  else{
    try{
      const st=await navigator.mediaDevices[kind==='screen'?'getDisplayMedia':'getUserMedia'](kind==='screen'?{video:true,audio:true}:{video:true});
      const vt=st.getVideoTracks()[0];call.vt=vt;call.vk=kind;addT(vt);
      const at=st.getAudioTracks()[0];if(at){call.sat=at;addT(at)}
      vt.onended=()=>{if(call&&call.vt===vt){delT(vt);call.vt=null;call.vk=null;if(call.sat){delT(call.sat);call.sat=null}call.upd[me.uid]?.();Object.keys(call.pcs).forEach(offer);renderCall()}};
    }catch(e){return}
  }
  call.upd[me.uid]?.();Object.keys(call.pcs).forEach(offer);renderCall();
}
function leaveCall(){
  if(!call)return;const c=call;call=null;
  c.sim?.stop();c.subs.forEach(f=>f());c.foot?.stop();clearInterval(c.ti);clearInterval(c.hb);if(c.music){c.music.a.pause();c.music.ctx.close()}
  if(c.room.startsWith('dm_')){const o=c.room.slice(3).split('_').find(x=>x!==me.uid);o&&db.collection('rings').doc(o).get().then(d=>d.exists&&d.data().from===me.uid&&d.ref.delete()).catch(()=>{})}
  c.stream?.getTracks().forEach(t=>t.stop());c.vt?.stop();
  Object.values(c.pcs).forEach(pc=>pc.close());
  c.base.collection('p').doc(me.uid).delete();
  if($('#cw'))renderCall();
}
addEventListener('pagehide',()=>call&&call.base.collection('p').doc(me.uid).delete());
addEventListener('beforeunload',e=>{if(CALLTAB&&call){e.preventDefault();e.returnValue=''}});
}
