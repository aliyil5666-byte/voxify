<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voxify</title><link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#110d1c;--bg2:#190f2b;--bg3:#241a3b;--tx:#ece8f7;--mut:#9b91ba;--cy:#2cc4e8;--pu:#7b3ff0;--mg:#b4249f;--g:linear-gradient(135deg,var(--cy),var(--pu) 55%,var(--mg))}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.45 Sora,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--bg3)}
button:hover{filter:brightness(1.25)}button:focus-visible,input:focus-visible{outline:2px solid var(--cy)}
input{background:var(--bg);border:1px solid var(--bg3);border-radius:10px;padding:10px 12px;width:100%}
.pri{background:var(--g);font-weight:600}
.logo{background:#fff;border-radius:16px;padding:6px}
#login{height:100%;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center;padding:24px}
#login .logo{width:150px}#login p{color:var(--mut);max-width:34ch;margin:0}
#app{height:100%;display:grid;grid-template-columns:68px 250px 1fr}
#rail{background:#0b0813;padding:10px;display:flex;flex-direction:column;gap:10px;align-items:center;overflow:auto}
#rail button{width:48px;height:48px;padding:0;border-radius:24px;font-weight:700;display:grid;place-items:center;overflow:hidden}
#rail button.on{border-radius:14px;background:var(--g)}#rail .logo{padding:3px;border-radius:14px}#rail img{width:42px}
#side{background:var(--bg2);padding:14px;overflow:auto;display:flex;flex-direction:column;gap:6px}
#side h3{margin:4px 0 6px;font-size:15px}#side h4{margin:12px 0 2px;font-size:13px;color:var(--mut);font-weight:600;display:flex;justify-content:space-between;align-items:center}
#side h4 button{padding:2px 9px}
.row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;padding:8px}
.row.on{background:var(--bg3)}
.av{width:30px;height:30px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
#me{margin-top:auto;display:flex;align-items:center;gap:9px;padding-top:10px;border-top:1px solid var(--bg3)}
#me span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
.hd{padding:14px 18px;border-bottom:1px solid var(--bg3);display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
#msgs{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.m{display:flex;gap:11px}.m b{font-size:14px}.m small{color:var(--mut);margin-left:6px}.m p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
#sf{padding:12px 18px;display:flex;gap:8px}
.empty{margin:auto;text-align:center;color:var(--mut);display:grid;gap:12px;justify-items:center;padding:20px}.empty .logo{width:110px}
#cw{flex:1;display:flex;flex-direction:column;min-height:0}
.grid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:16px;align-content:center;overflow:auto}
.tile{position:relative;aspect-ratio:16/9;background:var(--bg2);border-radius:14px;overflow:hidden;display:grid;place-items:center}
.tile .av{width:64px;height:64px;font-size:26px}.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0}
.tile span{position:absolute;left:10px;bottom:8px;background:#000a;padding:2px 9px;border-radius:8px;font-size:13px}
.ctl{display:flex;gap:10px;justify-content:center;padding:14px;border-top:1px solid var(--bg3);flex-wrap:wrap}
.off{background:var(--mg)}
@media(max-width:760px){#app{grid-template-columns:56px 1fr}#side{display:none}#side.show{display:flex;position:fixed;inset:0 0 0 56px;z-index:5}#mt{display:inline-block!important}}
#mt{display:none}
.simw{flex:1;min-height:0;position:relative}.simw canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hud{position:absolute;left:12px;top:12px;background:#0009;padding:6px 12px;border-radius:10px;font-size:13px;pointer-events:none}
.dot{width:10px;height:10px;border-radius:50%;background:#6b6580;margin-left:auto;flex:none}.dot.online{background:#3ddc84}.dot.idle{background:#ffb02e}.dot.busy{background:#ff5470}
.emo{display:flex;gap:2px;padding:0 18px;flex-wrap:wrap}.emo button{background:none;padding:2px 6px}
.del{background:none;color:var(--mut);padding:0 8px;margin-left:auto;opacity:.6}
.req{display:flex;gap:6px;align-items:center;margin:2px 0}.req span{flex:1;overflow:hidden;text-overflow:ellipsis}.req button{padding:6px 9px}
.code{font-weight:700;letter-spacing:.14em;text-align:center;border:1px dashed var(--pu)}
dialog{background:var(--bg2);color:var(--tx);border:1px solid var(--bg3);border-radius:16px;padding:22px;width:min(380px,92vw)}dialog::backdrop{background:#000b}
.pic{max-width:min(320px,100%);max-height:300px;border-radius:10px;margin-top:6px;display:block}
.fl{display:inline-block;margin-top:6px;background:var(--bg3);padding:6px 10px;border-radius:8px;color:var(--cy);text-decoration:none;word-break:break-all}
.hd{flex-wrap:wrap}.del+.del{margin-left:0}
.eb{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:96%}
.eb button{background:#000a;padding:6px 10px;font-size:13px}
.ftw{flex:1;display:grid;place-items:center;align-content:center;gap:8px;padding:12px;min-height:0;overflow:auto}
#fc{width:100%;max-width:880px;height:auto;border-radius:14px;background:#0d2018}
dialog form{display:grid;gap:10px}dialog label{display:grid;gap:4px;color:var(--mut);font-size:13px}
select{background:var(--bg);color:var(--tx);border:1px solid var(--bg3);border-radius:10px;padding:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<div id="login" hidden>
  <div class="logo"><img src="logo.png" alt="Voxify" width="150"></div>
  <p>Arkadaşlarınla yaz, konuş, görüntülü görüş.</p>
  <button class="pri" id="gbtn">Google ile giriş yap</button>
  <p id="warn" style="color:#ff8fa3"></p>
</div>

<div id="app" hidden>
  <nav id="rail"></nav>
  <aside id="side"></aside>
  <main id="main"></main>
</div>

<dialog id="pd"><form id="pf"><h3 style="margin:0">Profilini düzenle</h3>
<label>Kullanıcı adı<input name="nm" maxlength="24" required></label>
<label>Biyografi<input name="bio" maxlength="190" placeholder="Kendinden kısaca bahset"></label>
<label>Durum<select name="status"><option value="online">Çevrimiçi</option><option value="idle">Boşta</option><option value="busy">Rahatsız etmeyin</option><option value="offline">Görünmez</option></select></label>
<label>Profil fotoğrafı<input type="file" name="photo" accept="image/*"></label>
<button class="pri">Kaydet</button><button type="button" onclick="this.closest('dialog').close()">Kapat</button></form></dialog>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// 1) Firebase konsolundan aldığın ayarları buraya yapıştır (README.md'ye bak)
const firebaseConfig={apiKey:"BURAYA",authDomain:"BURAYA",projectId:"BURAYA",appId:"BURAYA"};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
if(firebaseConfig.apiKey==='BURAYA'){$('#login').hidden=false;$('#warn').textContent='Önce index.html içindeki firebaseConfig alanını doldur.';$('#gbtn').disabled=true}
else{
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp;
let me,view={type:'home'},unsubs=[],call=null,S={servers:[],friends:[],ch:[]};
const pair=(a,b)=>[a,b].sort().join('_');
const av=u=>`<span class="av">${u.photo?`<img src="${esc(u.photo)}" alt="" referrerpolicy="no-referrer">`:esc((u.name||'?')[0].toUpperCase())}</span>`;

$('#gbtn').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>$('#warn').textContent='Giriş yapılamadı: '+e.message);
auth.onAuthStateChanged(async u=>{
  if(!u){$('#login').hidden=false;$('#app').hidden=true;return}
  const ref=db.collection('users').doc(u.uid),sn=await ref.get();let fu;
  me=sn.exists?sn.data():{uid:u.uid,name:u.displayName||u.email.split('@')[0],photo:u.photoURL||'',bio:'',status:'online'};
  const need=!me.code;if(need)me.code=Math.random().toString(36).slice(2,10).toUpperCase();
  if(!sn.exists||need)await ref.set(me,{merge:true});
  $('#login').hidden=true;$('#app').hidden=false;
  db.collection('servers').where('members','array-contains',me.uid).onSnapshot(s=>{S.servers=s.docs.map(d=>({id:d.id,...d.data()}));renderRail();if(view.sid)loadMem()});
  db.collection('users').doc(me.uid).collection('friends').onSnapshot(s=>{
    const ids=s.docs.map(d=>d.id).slice(0,30);fu&&fu();
    if(!ids.length){S.friends=[];if(!view.sid)renderSide();return}
    fu=db.collection('users').where('uid','in',ids).onSnapshot(q=>{S.friends=q.docs.map(d=>d.data());if(!view.sid)renderSide()});
  });
  db.collection('requests').where('to','==',me.uid).onSnapshot(q=>{S.reqs=q.docs.map(d=>({id:d.id,...d.data()}));if(!view.sid)renderSide()});
  db.collection('users').doc(me.uid).collection('blocks').onSnapshot(q=>{S.blocks=q.docs.map(d=>d.data());renderSide();if(view.type==='text'||view.type==='dm')renderMain()});
  go({type:'home'});
});

function go(v){
  if(call&&!((v.type==='voice'||v.type==='foot')&&v.room===call.room))leaveCall();
  unsubs.forEach(f=>f());unsubs=[];
  if(v.sid!==view.sid){S.ch=[];S.mem=[]}
  view=v;
  if(v.sid)unsubs.push(db.collection('servers').doc(v.sid).collection('channels').onSnapshot(s=>{S.ch=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));renderSide()}));
  renderRail();renderSide();renderMain();$('#side').classList.remove('show');if(v.sid)loadMem();
}

function renderRail(){
  $('#rail').innerHTML=`<button class="logo ${!view.sid?'on':''}" data-h title="Ana sayfa"><img src="logo.png" alt="Ana sayfa"></button>`+
  S.servers.map(s=>`<button class="${view.sid===s.id?'on':''}" data-s="${s.id}" title="${esc(s.name)}">${esc(s.name.slice(0,2).toUpperCase())}</button>`).join('')+
  `<button data-add title="Sunucu oluştur veya katıl">+</button>`;
}
function renderSide(){
  const el=$('#side');let h='';
  if(!view.sid){
    h=`<h3>Arkadaşlar</h3><button class="code" data-copy="${me.code}" title="Kopyala">${me.code}</button><small style="color:var(--mut)">Arkadaşlık kodun. Paylaş, istek göndersinler.</small>
    <form id="cf"><input required maxlength="12" placeholder="Arkadaşının kodu" style="text-transform:uppercase"><button class="pri" style="margin-top:6px;width:100%">İstek gönder</button></form>`+
    (reqs().length?'<h4>Gelen istekler</h4>'+reqs().map(r=>`<div class="req">${av(r)}<span>${esc(r.name)}</span><button class="pri" data-acc="${r.id}">Kabul</button><button data-dec="${r.id}">Reddet</button></div>`).join(''):'')+
    `<h4>Mesajlar</h4>`+
    (S.friends.map(f=>`<button class="row ${view.peer===f.uid?'on':''}" data-f="${f.uid}">${av(f)}${esc(f.name)}<i class="dot ${f.status||'online'}"></i></button>`).join('')||'<p style="color:var(--mut)">Henüz arkadaşın yok. Kodunu paylaş ya da arkadaşının kodunu gir.</p>')+
    (S.blocks&&S.blocks.length?'<h4>Engellenenler</h4>'+S.blocks.map(b=>`<div class="req"><span>${esc(b.name)}</span><button data-ub="${b.uid}">Kaldır</button></div>`).join(''):'');
  }else{
    const s=S.servers.find(x=>x.id===view.sid)||{name:'',owner:''},own=s.owner===me.uid;
    const list=t=>S.ch.filter(c=>c.type===t).map(c=>`<button class="row ${view.cid===c.id?'on':''}" data-c="${c.id}" data-t="${t}" data-n="${esc(c.name)}">${t==='text'?'#':'🔊'} ${esc(c.name)}</button>`).join('');
    h=`<h3>${esc(s.name)}</h3><button data-copy="${esc(s.code)}" title="Kopyala">Davet kodu: #${esc(s.code)}</button>
    <h4>Metin odaları ${own?'<button data-nc="text">+</button>':''}</h4>${list('text')}
    <h4>Ses odaları ${own?'<button data-nc="voice">+</button>':''}</h4>${list('voice')}
    <h4>Üyeler (${(S.mem||[]).length})</h4>${(S.mem||[]).map(u=>`<div class="row">${av(u)}${esc(u.name)}<i class="dot ${u.status||'online'}"></i>${u.uid!==me.uid?`<button class="del" style="margin-left:6px" data-bl="${u.uid}" title="Engelle">⛔</button>`:''}</div>`).join('')}
    <button class="row" data-lv style="color:var(--mg)">${own?'Sunucuyu sil':'Sunucudan ayrıl'}</button>`;
  }
  el.innerHTML=h+`<div id="me">${av(me)}<span>${esc(me.name)}</span><button data-prof>Profil</button><button data-out>Çıkış</button></div>`;
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if('h' in d)go({type:'home'});
  else if(d.s)go({type:'server',sid:d.s});
  else if('add' in d)addServer();
  else if(d.f){const f=S.friends.find(x=>x.uid===d.f);go({type:'dm',peer:f.uid,name:f.name})}
  else if(d.c)go({type:d.t==='text'?'text':'voice',sid:view.sid,cid:d.c,room:d.c,name:d.n});
  else if(d.nc){const n=prompt('Oda adı:');if(n)db.collection('servers').doc(view.sid).collection('channels').add({name:n.trim().slice(0,30),type:d.nc})}
  else if(d.copy){navigator.clipboard?.writeText(d.copy);t.textContent='Kopyalandı'}
  else if('out' in d){leaveCall();auth.signOut()}
  else if('mt' in d)$('#side').classList.toggle('show');
  else if('join' in d)joinCall(view.room);
  else if('sim' in d)toggleSim();
  else if('foot' in d)go({type:'foot',peer:view.peer,room:'fb_'+pair(me.uid,view.peer),name:view.name});
  else if('lvf' in d)go({type:'dm',peer:view.peer,name:view.name});
  else if('att' in d)$('#fi').click();
  else if(d.ed){const r=chatRef().doc(d.ed),dd=await r.get(),n=prompt('Mesajı düzenle',dd.data().text);if(n&&n.trim()&&n.trim()!==dd.data().text)r.update({text:n.trim().slice(0,2000),edited:true})}
  else if(d.rf){if(!confirm('Arkadaşlıktan çıkarılsın mı?'))return;await unfriend(d.rf);go({type:'home'})}
  else if(d.bl)block(d.bl,(S.friends.find(x=>x.uid===d.bl)||(S.mem||[]).find(x=>x.uid===d.bl)||{}).name||'Kullanıcı');
  else if(d.ub)db.collection('users').doc(me.uid).collection('blocks').doc(d.ub).delete();
  else if('prof' in d)openProfile();
  else if(d.acc){const r=S.reqs.find(x=>x.id===d.acc);await db.collection('users').doc(me.uid).collection('friends').doc(r.from).set({uid:r.from});await db.collection('users').doc(r.from).collection('friends').doc(me.uid).set({uid:me.uid});await db.collection('requests').doc(d.acc).delete()}
  else if(d.dec)db.collection('requests').doc(d.dec).delete();
  else if(d.del)chatRef().doc(d.del).delete();
  else if(d.e){const i=$('#sf input');if(i){i.value+=d.e;i.focus()}}
  else if('lv' in d){const sv=S.servers.find(x=>x.id===view.sid);if(!confirm(sv.owner===me.uid?'Sunucu silinsin mi?':'Sunucudan ayrılmak istiyor musun?'))return;
    if(sv.owner===me.uid)await db.collection('servers').doc(sv.id).delete();else await db.collection('servers').doc(sv.id).update({members:firebase.firestore.FieldValue.arrayRemove(me.uid)});go({type:'home'})}
  else if('leave' in d)leaveCall();
  else if('mic' in d)toggleMic(t);
  else if(d.vid)toggleVideo(d.vid,t);
  else if('dmcall' in d)go({type:'voice',peer:view.peer,room:'dm_'+pair(me.uid,view.peer),name:view.name,dm:1});
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='cf'){
    const code=e.target.querySelector('input').value.trim().toUpperCase();
    const q=await db.collection('users').where('code','==',code).limit(1).get();
    if(q.empty)return alert('Bu kodla kullanıcı bulunamadı.');
    const f=q.docs[0].data();if(f.uid===me.uid)return alert('Bu senin kendi kodun.');
    if(S.friends.some(x=>x.uid===f.uid))return alert('Zaten arkadaşsınız.');
    if(BL().has(f.uid))return alert('Bu kullanıcıyı engellemişsin. Önce engeli kaldır.');
    if((await db.collection('users').doc(f.uid).collection('blocks').doc(me.uid).get()).exists)return alert('İstek gönderilemedi.');
    await db.collection('requests').doc(me.uid+'_'+f.uid).set({from:me.uid,to:f.uid,name:me.name,photo:me.photo||''});
    alert(f.name+' kişisine arkadaşlık isteği gönderildi.');e.target.reset();
  }else if(e.target.id==='pf'){
    const f=e.target,v={name:f.nm.value.trim()||me.name,bio:f.bio.value.slice(0,190),status:f.status.value};
    if(f.photo.files[0])v.photo=await readPhoto(f.photo.files[0]);
    Object.assign(me,v);await db.collection('users').doc(me.uid).update(v);$('#pd').close();renderSide();
  }else if(e.target.id==='sf'){
    const i=e.target.querySelector('input'),text=i.value.trim();if(!text)return;i.value='';
    chatRef().add({text:text.slice(0,2000),uid:me.uid,name:me.name,t:TS()});
  }
});

async function addServer(){
  const n=prompt('Yeni sunucu adı yaz.\nDavet koduyla katılmak için kodu # ile başlat (örn. #AB12CD).');
  if(!n)return;
  if(n[0]==='#'){
    const q=await db.collection('servers').where('code','==',n.slice(1).trim().toUpperCase()).limit(1).get();
    if(q.empty)return alert('Bu kodla sunucu bulunamadı.');
    await q.docs[0].ref.update({members:firebase.firestore.FieldValue.arrayUnion(me.uid)});
    return go({type:'server',sid:q.docs[0].id});
  }
  const ref=await db.collection('servers').add({name:n.trim().slice(0,30),owner:me.uid,members:[me.uid],code:Math.random().toString(36).slice(2,8).toUpperCase()});
  await ref.collection('channels').add({name:'genel',type:'text'});
  await ref.collection('channels').add({name:'Sohbet',type:'voice'});
  go({type:'server',sid:ref.id});
}

const chatRef=()=>view.type==='dm'?db.collection('dms').doc(pair(me.uid,view.peer)).collection('messages')
  :db.collection('servers').doc(view.sid).collection('channels').doc(view.cid).collection('messages');

function renderMain(){
  const m=$('#main'),menu='<button id="mt" data-mt>Menü</button>';
  if(view.type==='home'){m.innerHTML=`<div class="empty"><div class="logo"><img src="logo.png" alt="" width="110"></div><b>Voxify'a hoş geldin</b><span>Soldan arkadaş seç ya da + ile sunucu oluştur.</span></div>`;return}
  if(view.type==='server'){m.innerHTML=`<div class="empty"><span>Sol taraftan bir oda seç.</span></div>`;return}
  if(view.type==='foot'){startFoot();return}
  if(view.type==='voice'){
    m.innerHTML=`<div class="hd"><span>${menu} 🔊 ${esc(view.name)}</span></div><div id="cw"></div>`;renderCall();return}
  m.innerHTML=`<div class="hd"><span>${menu} ${view.type==='dm'?'@ ':'# '}${esc(view.name)}</span>${view.type==='dm'?`<small style="color:var(--mut);font-weight:400;flex:1">${esc((S.friends.find(x=>x.uid===view.peer)||{}).bio||'')}</small>`:''}${view.type==='dm'?`<span><button data-foot>⚽ Futbol</button> <button data-dmcall>Sesli / görüntülü ara</button> <button data-rf="${view.peer}">Arkadaşlıktan çıkar</button> <button data-bl="${view.peer}">Engelle</button></span>`:''}</div>
  <div id="msgs"></div><div class="emo">${['😀','😂','❤️','👍','🔥','🎉','😮','🙏'].map(x=>`<button type="button" data-e="${x}">${x}</button>`).join('')}</div><input type="file" id="fi" hidden><form id="sf"><button type="button" data-att title="Dosya veya görsel ekle">📎</button><input placeholder="Mesaj yaz" autocomplete="off"><button class="pri">Gönder</button></form>`;
  unsubs.push(chatRef().orderBy('t').limitToLast(100).onSnapshot(s=>{
    const box=$('#msgs');if(!box)return;

    const V=host()?S:D;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,880,520);x.translate(40,20);
    for(let i=0;i<8;i++){x.fillStyle=i%2?'#163826':'#123021';x.fillRect(i*W/8,0,W/8,H)}
    x.strokeStyle='#ffffff55';x.lineWidth=3;x.strokeRect(0,0,W,H);x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,H);x.stroke();x.beginPath();x.arc(W/2,H/2,70,0,6.283);x.stroke();
    [[-34,'#2cc4e8'],[W,'#b4249f']].forEach(([gx,c])=>{x.fillStyle='#0008';x.fillRect(gx,H/2-GH/2,34,GH);x.strokeStyle=c;x.lineWidth=5;x.strokeRect(gx,H/2-GH/2,34,GH)});
    x.textAlign='center';x.fillStyle='#ffffff40';x.font='700 44px Sora,sans-serif';x.fillText(V.s[0]+'  -  '+V.s[1],W/2,56);
    x.fillStyle='#fff';x.beginPath();x.arc(V.b.x,V.b.y,BR,0,6.283);x.fill();
    V.p.forEach((p,i)=>{x.fillStyle=i?'#b4249f':'#2cc4e8';x.beginPath();x.arc(p.x,p.y,R,0,6.283);x.fill();
      if((i===0)===host()){x.strokeStyle='#fff';x.lineWidth=3;x.stroke()}x.fillStyle='#fff';x.font='600 13px Sora,sans-serif';x.fillText(nm(i),p.x,p.y-R-8)});
    const msg=!open()?'Rakip bekleniyor…':V.m;if(msg){x.fillStyle='#000a';x.fillRect(0,H/2-44,W,88);x.fillStyle='#fff';x.font='700 38px Sora,sans-serif';x.fillText(msg,W/2,H/2+13)}};
  const loop=t=>{raf=requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.1);last=t;
    if(open()){if(host()){acc+=dt;while(acc>1/60){step(1/60);acc-=1/60}}
      else{D.p.forEach((p,i)=>{p.x+=(S.p[i].x-p.x)*.5;p.y+=(S.p[i].y-p.y)*.5});D.b.x+=(S.b.x-D.b.x)*.5;D.b.y+=(S.b.y-D.b.y)*.5;D.s=S.s;D.m=S.m}}
    draw()};
  raf=requestAnimationFrame(loop);
  const iv=setInterval(()=>{if(!open())return;if(host())send({ft:1,s:{p:S.p.map(p=>[Math.round(p.x),Math.round(p.y)]),b:[Math.round(S.b.x),Math.round(S.b.y)],c:S.s,m:S.m}});else send({ft:1,k:K})},33);
  return{
    waiting:()=>!open(),
    gone(){rk=0;S.m=''},
    msg(id,d){if(d.k!==undefined)rk=d.k;if(d.s&&!host()){const q=d.s;q.p.forEach((v,i)=>{S.p[i].x=v[0];S.p[i].y=v[1]});S.b.x=q.b[0];S.b.y=q.b[1];S.s=q.c;S.m=q.m}},
    stop(){cancelAnimationFrame(raf);clearInterval(iv);removeEventListener('keydown',kd);removeEventListener('keyup',kd)}}
}

/* ---------- Sesli / görüntülü görüşme (WebRTC, sinyalleşme Firestore üzerinden) ---------- */
function renderCall(){
  const cw=$('#cw');
  if(!call){cw.innerHTML=`<div class="empty"><span>Bu odaya katılınca mikrofonun açılır. Kamera ve ekran paylaşımını sonra açabilirsin.</span><button class="pri" data-join>Odaya katıl</button></div>`;return}
  cw.innerHTML=`<div class="ctl-wrap" style="display:contents"></div>`;
  cw.append(call.sim?call.sim.w:call.grid);
  const c=document.createElement('div');c.className='ctl';
  c.innerHTML=`<button data-mic>Mikrofonu kapat</button><button data-vid="cam">Kamerayı aç</button><button data-vid="screen">Ekranı paylaş</button><button class="pri" data-sim>Simülasyon modu</button><button class="off" data-leave>Ayrıl</button>`;
  cw.append(c);
}
function tile(id,stream,mine,name){
  let t=call.grid.querySelector('[data-id="'+id+'"]');
  if(!t){t=document.createElement('div');t.className='tile';t.dataset.id=id;
    t.innerHTML=`<span class="av">${esc((name||'?')[0].toUpperCase())}</span><video autoplay playsinline ${mine?'muted':''}></video><span>${esc(mine?'Sen':name)}</span>`;call.grid.append(t)}
  const v=t.querySelector('video');v.srcObject=stream;
  const upd=()=>v.style.opacity=stream.getVideoTracks().some(x=>x.readyState==='live')?1:0;
  stream.onaddtrack=stream.onremovetrack=upd;upd();call.upd[id]=upd;
}
async function joinCall(room,dataOnly){
  let stream;
  if(!dataOnly)try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return alert('Mikrofon izni gerekli. Tarayıcı ayarlarından izin ver.')}
  const base=db.collection('calls').doc(room);
  call={room,base,stream,pcs:{},subs:[],upd:{},grid:Object.assign(document.createElement('div'),{className:'grid'})};
  const existing=await base.collection('p').get();
  await base.collection('p').doc(me.uid).set({name:me.name});
  if(stream)tile(me.uid,stream,true,me.name);
  existing.forEach(d=>d.id!==me.uid&&peer(d.id,true,d.data().name));
  call.subs.push(base.collection('p').onSnapshot(s=>s.docChanges().forEach(c=>c.type==='removed'&&drop(c.doc.id))));
  call.subs.push(base.collection('sig').where('to','==',me.uid).onSnapshot(s=>s.docChanges().forEach(c=>{
    if(c.type!=='added')return;const m=c.doc.data();c.doc.ref.delete();onSig(m)})));
  if(!dataOnly)renderCall();
  return existing.size
}
function sig(to,kind,data){call.base.collection('sig').add({to,from:me.uid,name:me.name,kind,data:JSON.stringify(data)})}
function peer(id,init,name){
  const pc=new RTCPeerConnection(ICE);call.pcs[id]=pc;
  call.stream?.getTracks().forEach(t=>pc.addTrack(t,call.stream));
  pc.onicecandidate=e=>e.candidate&&sig(id,'ice',e.candidate.toJSON());
  pc.ontrack=e=>tile(id,e.streams[0],false,name);
  (call.names=call.names||{})[id]=name;
  const wire=ch=>{ch.onmessage=e=>{if(!call)return;const d=JSON.parse(e.data);
    if(d.ft){call.foot&&call.foot.msg(id,d);return}
    if(!d.bye&&!call.sim&&!call.simOff&&call.stream&&$('#cw')){call.sim=startSim();renderCall()}
    call.sim&&call.sim.msg(id,d)};pc.dc=ch};
  if(init)wire(pc.createDataChannel('sim'));else pc.ondatachannel=e=>wire(e.channel);
  if(init)offer(id);
  return pc;
}
async function offer(id){const pc=call.pcs[id];const o=await pc.createOffer();await pc.setLocalDescription(o);sig(id,'offer',pc.localDescription.toJSON())}
async function onSig(m){
  if(!call)return;let pc=call.pcs[m.from];const d=JSON.parse(m.data);
  const flush=()=>{(pc.q||[]).forEach(x=>pc.addIceCandidate(x).catch(()=>{}));pc.q=[]};
  if(m.kind==='ice'){if(!pc)return;pc.remoteDescription?pc.addIceCandidate(d).catch(()=>{}):(pc.q=pc.q||[]).push(d)}
  else if(m.kind==='offer'){
    pc=pc||peer(m.from,false,m.name);
    await pc.setRemoteDescription(d);flush();
    const a=await pc.createAnswer();await pc.setLocalDescription(a);sig(m.from,'answer',pc.localDescription.toJSON());
  }else if(m.kind==='answer'&&pc){await pc.setRemoteDescription(d);flush()}
}
function drop(id){if(!call)return;call.sim?.rm(id);call.foot?.gone();call.pcs[id]?.close();delete call.pcs[id];call.grid.querySelector('[data-id="'+id+'"]')?.remove()}
function toggleMic(b){const t=call.stream.getAudioTracks()[0];t.enabled=!t.enabled;b.textContent=t.enabled?'Mikrofonu kapat':'Mikrofonu aç';b.classList.toggle('off',!t.enabled)}
async function toggleVideo(kind,b){
  const old=call.vt;
  if(old){old.stop();call.stream.removeTrack(old);Object.values(call.pcs).forEach(pc=>{const s=pc.getSenders().find(x=>x.track===old);s&&pc.removeTrack(s)});call.vt=null;call.vk=null}
  if(!old||call.vk!==kind&&false){}
  if(!old){
    try{const s=await navigator.mediaDevices[kind==='screen'?'getDisplayMedia':'getUserMedia']({video:true});
      const vt=s.getVideoTracks()[0];call.vt=vt;call.vk=kind;call.stream.addTrack(vt);
      Object.values(call.pcs).forEach(pc=>pc.addTrack(vt,call.stream));
      vt.onended=()=>call&&call.vt===vt&&toggleVideo(kind,b);
    }catch(e){return}
  }
  call.upd[me.uid]?.();
  document.querySelectorAll('[data-vid]').forEach(x=>x.textContent=(call.vt&&call.vk===x.dataset.vid)?'Durdur':(x.dataset.vid==='cam'?'Kamerayı aç':'Ekranı paylaş'));
  Object.keys(call.pcs).forEach(offer);
}
function leaveCall(){
  if(!call)return;const c=call;call=null;
  c.sim?.stop();c.subs.forEach(f=>f());c.foot?.stop();c.stream?.getTracks().forEach(t=>t.stop());c.vt?.stop();
  Object.values(c.pcs).forEach(pc=>pc.close());
  c.base.collection('p').doc(me.uid).delete();
  if($('#cw'))renderCall();
}
addEventListener('beforeunload',()=>call&&call.base.collection('p').doc(me.uid).delete());
}
